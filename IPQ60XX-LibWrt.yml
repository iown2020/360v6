name: 360V6-NSS 固件编译（Roc）

on:
  workflow_dispatch:
  workflow_call:

env:
  REPO_URL: https://github.com/laipeng668/openwrt-6.x.git
  REPO_BRANCH: main-nss
  CONFIG_FILE: configs/IPQ60XX.config
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Roc-script.sh
  FIRMWARE_TAG: 360V6-NSS
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 拉取配置仓库
        uses: actions/checkout@v4

      - name: 检查服务器性能
        run: |
          echo "警告⚠"
          echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
          echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息："
          echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get -y install $(curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E systemctl daemon-reload
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆 OpenWrt 源码
        run: |
          df -hT $GITHUB_WORKSPACE
          sudo mkdir -p /mnt/openwrt
          sudo chown -R $(id -u):$(id -g) /mnt/openwrt
          git clone --depth 1 -b $REPO_BRANCH --single-branch $REPO_URL /mnt/openwrt
          cd /mnt/openwrt
          echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
          VERSION_INFO=$(git show -s --date=short --format="作者: %an
时间: %cd
内容: %s
hash: %H")
          echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
          VERSION_KERNEL=$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-6.12)
          echo "VERSION_KERNEL=$VERSION_KERNEL" >> $GITHUB_ENV

      - name: 生成编译变量
        run: |
          cp $CONFIG_FILE $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig > /dev/null 2>&1
          SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
          echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
          DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
          echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
          DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
          echo "HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          echo "CACHE_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

      - name: 缓存工具链
        uses: actions/cache@v4
        with:
          key: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.HASH }} ${{ env.CACHE_DATE }}
          restore-keys: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-
          path: |
            ${{ env.OPENWRT_PATH }}/.ccache
            ${{ env.OPENWRT_PATH }}/staging_dir

      - name: 刷新缓存时间戳
        run: |
          if [ -d "$OPENWRT_PATH/staging_dir" ]; then
            find "$OPENWRT_PATH/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
                find "$dir" -type f -exec touch {} +
            done
          fi

      - name: 安装 Feeds（更新软件包索引）
        run: |
          cd $OPENWRT_PATH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行自定义脚本（Roc-script.sh）
        run: |
          chmod +x $DIY_SCRIPT
          cd $OPENWRT_PATH
          $GITHUB_WORKSPACE/$DIY_SCRIPT

      - name: 生成最终配置（合并配置 + 修复内核弹窗）
        run: |
          cat $CONFIG_FILE $GENERAL_CONFIG_FILE > $OPENWRT_PATH/.config
          cd $OPENWRT_PATH
          make defconfig
          # 强制写入修复，防止内核配置弹窗导致编译中断
          sed -i '/CONFIG_NF_CONNTRACK_DSCPREMARK_EXT/d' .config
          sed -i '/CONFIG_NETFILTER_EGRESS/d' .config
          sed -i '/CONFIG_NF_CONNTRACK_PROCFS/d' .config
          echo "CONFIG_NF_CONNTRACK_DSCPREMARK_EXT=n" >> .config
          echo "CONFIG_NETFILTER_EGRESS=n" >> .config
          echo "CONFIG_NF_CONNTRACK_PROCFS=y" >> .config
          make olddefconfig

      - name: 下载所有依赖
        run: |
          cd $OPENWRT_PATH
          make download -j$(nproc)

      - name: 编译固件（自动容错）
        id: compile
        run: |
          cd $OPENWRT_PATH
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT
          echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

      - name: 检查空间使用情况
        if: (!cancelled())
        run: df -hT

      - name: 整理固件文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd $OPENWRT_PATH/bin/targets/*/*
          cp $OPENWRT_PATH/.config 360V6-NSS.config
          mv config.buildinfo 360V6-NSS.config.buildinfo
          mv libwrt-qualcommax-ipq60xx.manifest 360V6-NSS.manifest 2>/dev/null || true
          mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages 2>/dev/null || true
          tar -zcf 360V6-NSS.Packages.tar.gz packages 2>/dev/null || true
          rm -rf packages feeds.buildinfo version.buildinfo sha256sums profiles.json
          echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

      - name: 上传固件到 Artifact
        if: steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_TAG }}
          path: ${{ env.FIRMWARE_PATH }}/*

      - name: 发布固件到 Release
        if: steps.compile.outputs.status == 'success'
        uses: ncipollo/release-action@v1
        with:
          name: ${{ env.DATE }} for ${{ env.FIRMWARE_TAG }}
          allowUpdates: true
          tag: ${{ env.FIRMWARE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ env.FIRMWARE_PATH }}/*
          body: |
            **This is OpenWrt Firmware for ${{ env.FIRMWARE_TAG }}**
            ### 📒 固件信息
            - 这是开启全功能NSS的6.12内核固件，默认主题为Aurora；该固件在LibWrt的基础上，添加了额外的软件包OpenClash、AdGuardHome、EasyTier、cpufreq、ddns、upnp、wol、samba4、vlmcsd、autoreboot、uhttpd、frps、frpc、diskman、hd-idle、acme、wireguard、watchcat、3cat、passwall，并添加了若干工具，具体详见IPQ60XX.config和General.config。
            - 💻 这是 ${{ env.FIRMWARE_TAG }} 平台使用的 OpenWrt 固件
            - ⚽ 固件源码: ${{ env.REPO_URL }}
            - 💝 源码分支: ${{ env.REPO_BRANCH }}
            - 🌐 默认地址: **192.168.50.1**
            - 🔑 默认密码: none
            ### 🧊 固件版本
            - 固件内核版本：**${{ env.VERSION_KERNEL }}**
            - 固件编译前最后一次➦[主源码](${{ env.REPO_URL }})更新记录
            - ${{ env.VERSION_INFO }}

      - name: 删除旧缓存
        run: |
          gh cache list --key ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}- --json key --jq '.[] | .key' | while read -r key; do
            gh cache delete "$key"
          done
          echo "========cache status========"
          echo "ccache: $(du -sh $OPENWRT_PATH/.ccache 2>/dev/null | cut -f 1)"
          echo "staging: $(du -sh $OPENWRT_PATH/staging_dir 2>/dev/null | cut -f 1)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
